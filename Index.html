<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOUMOVYA STORE</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">

<style>
:root{
--dark:#3e2723;
--medium:#6d4c41;
--accent:#a1887f;
--light:#efebe9;
}

body{
margin:0;
font-family:'Cairo',sans-serif;
background:linear-gradient(135deg,#f5f1ed,#ede7e3);
direction:rtl;
color:var(--dark);
}

/* NAVBAR */
nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 40px;
background:white;
box-shadow:0 4px 20px rgba(0,0,0,0.05);
position:sticky;
top:0;
z-index:100;
}

.logo{
font-size:22px;
font-weight:800;
letter-spacing:2px;
}

.contact{
font-size:14px;
color:var(--medium);
display:flex;
gap:10px;
align-items:center;
}

.contact a{
color:var(--medium);
text-decoration:none;
}

/* HERO */
.hero{
text-align:center;
padding:50px 20px;
}

.hero h1{
font-size:32px;
margin-bottom:10px;
}

.hero p{
color:var(--medium);
font-size:16px;
}

/* CATEGORIES */
.categories{
display:flex;
justify-content:center;
gap:15px;
flex-wrap:wrap;
margin-bottom:30px;
}

.categories button{
padding:10px 20px;
border:1px solid var(--medium);
background:white;
color:var(--medium);
border-radius:30px;
cursor:pointer;
transition:0.3s;
font-weight:600;
}

.categories button:hover{
background:var(--medium);
color:white;
}

/* PRODUCTS GRID 2x2 */
.products{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:25px;
padding:30px;
}

.card{
background:white;
border-radius:20px;
overflow:hidden;
box-shadow:0 10px 30px rgba(0,0,0,0.07);
transition:0.4s;
position:relative;
}

.card:hover{
transform:translateY(-8px);
}

.slider{
position:relative;
height:400px;
overflow:hidden;
}

.slider img{
width:100%;
height:100%;
object-fit:cover;
position:absolute;
opacity:0;
transition:opacity 0.5s;
border-radius:15px 15px 0 0;
}

.slider img.active{opacity:1;}

.card-content{
padding:20px;
text-align:center;
}

.card h3{
margin:10px 0 5px;
font-size:18px;
}

.card p{
color:var(--medium);
font-size:14px;
margin-bottom:10px;
}

.price{
font-size:18px;
font-weight:800;
margin-bottom:10px;
color:var(--dark);
}

.buttons{
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
}

.buttons a{
display:inline-block;
padding:10px 15px;
border-radius:25px;
text-decoration:none;
color:white;
background:var(--dark);
transition:0.3s;
font-size:14px;
}

.buttons a:hover{
background:var(--accent);
}

.social-icons{
display:flex;
justify-content:center;
gap:10px;
margin-top:10px;
}

.social-icons a{
text-decoration:none;
color:white;
background:var(--medium);
padding:8px 10px;
border-radius:8px;
font-size:14px;
transition:0.3s;
}

.social-icons a:hover{
background:var(--dark);
}

/* FOOTER */
footer{
text-align:center;
padding:25px;
background:var(--dark);
color:white;
margin-top:50px;
font-size:14px;
}

/* RESPONSIVE */
@media(max-width:768px){
.products{grid-template-columns:1fr;}
.slider{height:300px;}
}
</style>
</head>

<body>

<nav>
<div class="logo">LOUMOVYA</div>
<div class="contact">
<a href="https://wa.me/212703432849" target="_blank">واتساب: 0703432849</a>
</div>
</nav>

<section class="hero">
<h1>متجر المستقبل للأناقة والعناية</h1>
<p>مكملات • تجميل • ملابس — الجودة التي تستحقها</p>
</section>

<div class="categories">
<button onclick="filterProducts('الكل')">الكل</button>
<button onclick="filterProducts('مكملات')">مكملات</button>
<button onclick="filterProducts('تجميل')">تجميل</button>
<button onclick="filterProducts('ملابس')">ملابس</button>
</div>

<div class="products" id="products"></div>

<footer>
جميع الحقوق محفوظة © 2026 LOUMOVYA
<div class="social-icons">
<a href="https://www.facebook.com/share/1AjBU1THBd/" target="_blank">Facebook</a>
<a href="https://www.tiktok.com/@loumovya" target="_blank">TikTok</a>
<a href="https://www.instagram.com/loumovya?igsh=NjJpbnB0NjhsbG1m" target="_blank">Instagram</a>
</div>
</footer>

<script>
let products = JSON.parse(localStorage.getItem("products")) || [];

function displayProducts(filter){
let container = document.getElementById("products");
container.innerHTML="";

products.forEach((p,index)=>{
if(filter==="الكل" || p.category===filter){
container.innerHTML+=`
<div class="card">
<div class="slider" id="slider${index}">
<img src="${p.images[0]}" class="active">
${p.images[1] ? `<img src="${p.images[1]}">` : ''}
</div>
<div class="card-content">
<h3>${p.name}</h3>
<p>${p.description}</p>
<div class="price">${p.price} درهم مغربي</div>
<div class="buttons">
<a href="https://wa.me/212703432849?text=أريد طلب ${p.name}" target="_blank">طلب واتساب</a>
</div>
</div>
</div>
`;
}
});

// initialize sliders
products.forEach((p,index)=>{
if(p.images.length>1){
let imgs = document.querySelectorAll(`#slider${index} img`);
let i=0;
setInterval(()=>{
imgs.forEach(img=>img.classList.remove("active"));
i=(i+1)%imgs.length;
imgs[i].classList.add("active");
},2000);
}
});
}

function filterProducts(cat){displayProducts(cat);}
displayProducts("الكل");
</script>

</body>
</html>
